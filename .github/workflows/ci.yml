name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # The job name is the required status check in .github/rulesets/main.json. Keep them in sync.
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The review gate's own tests and the profile's guarded sources. A drifted
      # guard fails here, before any reviewer spends a round on it.
      - name: Review gate
        run: node --test .github/scripts/validate-review-profile.test.mjs
      - name: Review gate decision
        run: node --test .github/scripts/review-gate.test.mjs
      - name: Review profile
        run: node .github/scripts/validate-review-profile.mjs .github/review/bank-agent-assist-software-review-v1.json --profile-id bank-agent-assist-software
      # Format, lint, typecheck and unit tests.
      - run: npm run check
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
